name: Build APK

on:
  # push без фильтров = любая ветка и любой тег: сборка стартует и по пушу ветки,
  # и по тегу v* (последнее нужно джобе release).
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Держим в одном месте: совпадает с ndkVersion / cmake.version в app/build.gradle
  NDK_VERSION: '26.1.10909125'
  CMAKE_VERSION: '3.22.1'
  COMPILE_SDK: '34'
  BUILD_TOOLS: '34.0.0'

jobs:
  # Хост-тесты нативного ядра: g++ без Android SDK, идут быстро и падают раньше сборки.
  native-tests:
    name: Native tests (host)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run native self-test
        run: bash tools/run_native_tests.sh

  build:
    name: APK (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: native-tests
    strategy:
      fail-fast: false
      matrix:
        variant: [debug, release]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # android-actions/setup-android@v3 не берём: его дефолтный `packages: tools`
      # падает с "Failed to find package 'tools'" — legacy-пакет tools из SDK удалён.
      # На ubuntu-latest sdkmanager уже лежит в $ANDROID_HOME/cmdline-tools/latest.
      - name: Set up Android SDK, NDK and CMake
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || { echo "::error::sdkmanager не найден: $SDKMANAGER"; exit 1; }
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" \
            "platforms;android-$COMPILE_SDK" \
            "build-tools;$BUILD_TOOLS" \
            "cmake;$CMAKE_VERSION" \
            "ndk;$NDK_VERSION" 2>&1 | tail -20

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Assemble ${{ matrix.variant }} APK
        run: |
          chmod +x gradlew
          ./gradlew "assemble$(tr '[:lower:]' '[:upper:]' <<< "${{ matrix.variant }}")" --stacktrace

      - name: Collect artifacts
        run: |
          set -euo pipefail
          VERSION="$(grep -oP "versionName '\K[^']+" app/build.gradle | head -1)"
          VERSION_CODE="$(grep -oP "versionCode \K[0-9]+" app/build.gradle | head -1)"
          APK_SRC="$(ls "app/build/outputs/apk/${{ matrix.variant }}/"*.apk | head -1)"
          APK_NAME="MIUNLOCK-$VERSION-$VERSION_CODE-${{ matrix.variant }}.apk"
          mkdir -p dist
          cp "$APK_SRC" "dist/$APK_NAME"
          echo "APK_PATH=dist/$APK_NAME" >> "$GITHUB_ENV"
          ls -la dist

      # Release собирается без signingConfig, поэтому APK не подписан.
      # Если в репозитории заданы секреты KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD,
      # подписываем его здесь — получается установимый релизный APK.
      - name: Detect release keystore
        id: keystore
        if: matrix.variant == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Секрет KEYSTORE_BASE64 не задан — релизный APK остаётся неподписанным."
          fi

      - name: Sign release APK
        if: matrix.variant == 'release' && steps.keystore.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          trap 'rm -f /tmp/release.keystore' EXIT
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks /tmp/release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$APK_PATH" \
            "app/build/outputs/apk/release/app-release-unsigned.apk"
          "$BUILD_TOOLS_DIR/apksigner" verify --print-certs "$APK_PATH"

      - name: Verify APK
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          # aapt в пайп с head ломается через SIGPIPE при pipefail — сначала в файл
          "$BUILD_TOOLS_DIR/aapt" dump badging "$APK_PATH" > /tmp/badging.txt
          head -3 /tmp/badging.txt
          echo "--- native libs ---"
          unzip -l "$APK_PATH" | grep -E '\.so$' || echo "нет .so в APK"
          echo "--- signature ---"
          "$BUILD_TOOLS_DIR/apksigner" verify --print-certs "$APK_PATH" || \
            echo "::notice::APK не подписан — ожидаемо для release без секретов KEYSTORE_*."
          exit 0

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MIUNLOCK-${{ matrix.variant }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload R8 mapping
        if: matrix.variant == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: MIUNLOCK-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 30

  # Срабатывает на тег вида v1.0 — выкладывает APK в релиз GitHub.
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.apk
          generate_release_notes: true
